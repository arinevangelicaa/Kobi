name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Push beruntun pada branch yang sama membatalkan run lama, supaya antrean
# runner tidak menumpuk.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma Client tidak di-commit, jadi harus dibuat ulang sebelum
      # typecheck dan build. Langkah ini tidak menyentuh basis data.
      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Tes integrasi Route Handler terhadap Postgres sungguhan (docs/architecture.md
  # bagian 16). Job terpisah supaya job `build` di atas tetap tidak butuh basis
  # data. Tidak ada secret yang dibutuhkan, dan job ini TIDAK menyentuh Azure:
  # semua panggilan Azure OpenAI dimock lewat `fetch` tiruan, dan Azure Maps
  # sengaja tidak dikonfigurasi (rekomendasi memakai jarak garis lurus).
  integration:
    name: Tes integrasi (Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kobi
          POSTGRES_PASSWORD: kobi_test
          POSTGRES_DB: kobi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kobi -d kobi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Kredensial basis data uji sekali pakai milik service container di atas,
      # bukan secret. tests/integration/setup.ts menolak DATABASE_URL selain
      # host lokal dengan nama basis data yang memuat "test".
      DATABASE_URL: postgresql://kobi:kobi_test@localhost:5432/kobi_test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Terapkan migrasi ke basis data uji
        run: npx prisma migrate deploy

      - name: Tes integrasi
        run: npm run test:integration
