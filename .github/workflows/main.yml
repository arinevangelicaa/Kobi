name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Push beruntun pada branch yang sama membatalkan run lama, supaya antrean
# runner tidak menumpuk.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma Client tidak di-commit, jadi harus dibuat ulang sebelum
      # typecheck dan build. Langkah ini tidak menyentuh basis data.
      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
